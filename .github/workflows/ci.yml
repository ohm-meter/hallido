name: CI
on:
  push:
    branches: [ master ]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)" || (echo 'gofmt needed'; gofmt -l cmd internal; exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Install layout (shell + migration in a container)
        run: |
          ./scripts/test/install-layout.sh
          ./scripts/test/install-migration-docker.sh
      - name: NAS project file
        run: ./scripts/test/nas-compose.sh
      - name: API smoke test (mock)
        run: ./scripts/test/api-smoke.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: GUI tests (static + layout)
        run: |
          npm ci
          npx playwright install chromium --with-deps
          make test-gui
      - name: Cross-compile Pi (arm64, armv7)
        run: |
          GOOS=linux GOARCH=arm64 go build ./cmd/server
          GOOS=linux GOARCH=arm GOARM=7 go build ./cmd/server

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: govulncheck (code + Go standard library of the release toolchain)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all platforms (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
      - name: Build amd64 image for the checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hallido:ci
      - name: Vulnerability scan (Grype, high/critical with a fix fails)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: hallido:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Smoke test with the NAS hardening (read-only, no capabilities, setup)
        run: ./scripts/test/container-smoke.sh hallido:ci
