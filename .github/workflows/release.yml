name: Release
# Tag v* -> test, binaries + SHA256SUMS, then the container image (ADR 0021):
# multi-arch build -> GHCR, SBOM, vulnerability gate, keyless signature
# (Sigstore/cosign with the workflow's GitHub OIDC identity), SBOM
# attestation, and the NAS project file compose.yaml pinned to the digest.
# Third-party actions are pinned by commit SHA.
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: read
env:
  IMAGE: ghcr.io/ohm-meter/hallido
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      id-token: write   # keyless signature of SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: Test
        run: go vet ./... && go test ./... && ./scripts/test/nas-compose.sh
      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build archives (Linux amd64/arm64/armv7/armv6, macOS)
        run: ./scripts/dist.sh "${GITHUB_REF_NAME}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sigstore.json \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload compose.yaml & co. to the release
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing (Sigstore, GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64, linux/arm/v7)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      - name: Image reference
        id: ref
        run: echo "image=${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: hallido-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Vulnerability gate (high/critical with a fix -> no signature, no release file)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: hallido-image.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image and attest SBOM (keyless)
        env:
          REF: ${{ steps.ref.outputs.image }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate hallido-image.spdx.json "$REF"
      - name: Verify signature (same check as docs/how-to/verify-image.md)
        env:
          REF: ${{ steps.ref.outputs.image }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: NAS project file pinned to the digest
        env:
          REF: ${{ steps.ref.outputs.image }}
        run: |
          ./scripts/render-compose.sh "$REF" "${GITHUB_REF_NAME}" > compose.yaml
          sha256sum compose.yaml > compose.yaml.sha256
          echo "$REF" > IMAGE_DIGEST.txt
          cosign sign-blob --yes --bundle compose.yaml.sigstore.json compose.yaml
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.image }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" compose.yaml compose.yaml.sha256 compose.yaml.sigstore.json \
            IMAGE_DIGEST.txt hallido-image.spdx.json
          {
            gh release view "${GITHUB_REF_NAME}" --json body --jq .body
            printf '\n## Container image (NAS)\n\n'
            printf 'Image: `%s`\n\n' "$REF"
            printf 'Install on Synology/QNAP with `compose.yaml` from this release: '
            printf '[guide](https://github.com/%s/blob/master/docs/nas/en/README.md). ' "$GITHUB_REPOSITORY"
            printf 'Verify before installing: [docs/how-to/verify-image.md](https://github.com/%s/blob/master/docs/how-to/verify-image.md).\n' "$GITHUB_REPOSITORY"
          } > notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
