# Local test of the container image with the MOCK driver (no speakers):
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Then open http://localhost:8790 – the setup wizard creates the access key.
# For a NAS use the release project file instead (deploy/nas/, guide
# docs/nas/), which pins the signed image by digest and uses host networking.
services:
  hallido:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8790:8790"
    environment:
      - SRA_DRIVER=mock
      # Optional: fixed token instead of the setup wizard
      # - SRA_API_TOKEN=${SRA_API_TOKEN}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - hallido-dev-data:/data

volumes:
  hallido-dev-data:
